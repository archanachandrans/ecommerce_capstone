name: Automation Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which suite to run"
        type: choice
        options: [all, ui, api]
        default: all

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Select test selection
        id: select
        run: |
          SUITE="${{ github.event.inputs.suite || 'all' }}"
          case "$SUITE" in
            ui)  echo "marker=ui" >> "$GITHUB_OUTPUT" ;;
            api) echo "marker=api" >> "$GITHUB_OUTPUT" ;;
            *)   echo "marker=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run tests
        env:
          HEADLESS: "true"
          BROWSER: chromium
        run: |
          if [ -n "${{ steps.select.outputs.marker }}" ]; then
            pytest -m "${{ steps.select.outputs.marker }}"
          else
            pytest
          fi
        continue-on-error: true   # keep going so the report and artifacts are always uploaded

      - name: Upload HTML and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail the job if tests failed
        if: always()
        run: |
          test -f reports/junit.xml || { echo "No JUnit report was produced"; exit 1; }
          if grep -q -E '<(failure|error)' reports/junit.xml; then
            echo "One or more tests failed. See the uploaded test-reports artifact."
            exit 1
          fi
